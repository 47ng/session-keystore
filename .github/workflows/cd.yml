name: Continuous Delivery

on:
  push:
    branches:
      - master
      - beta # Prereleases on the `beta` dist-tag

permissions:
  contents: read

# One release at a time, across master and beta
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Tags and GitHub releases
      issues: write # Comments on released issues
      pull-requests: write # Comments on released pull requests
      id-token: write # npm trusted publishing, with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm build
        name: Build package
      - run: pnpm exec semantic-release
        name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
